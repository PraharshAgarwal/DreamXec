    var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
    function loadTawk() {

      // Clean up event listeners
      window.removeEventListener('scroll', handleScroll);
      window.removeEventListener('click', triggerTawkLoad);
      window.removeEventListener('touchstart', triggerTawkLoad);
    }

    function triggerTawkLoad() {
      loadTawk();
    }

    function handleScroll() {
      if (window.scrollY > 150 || document.documentElement.scrollTop > 150) {
        triggerTawkLoad();
      }
    }

    // Defer loading until after page is idle or user interacts to avoid font/network contention
    if (typeof window !== 'undefined') {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(function() {
          setTimeout(loadTawk, 8000);
        });
      } else {
        setTimeout(loadTawk, 10000);
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      window.addEventListener('click', triggerTawkLoad, { once: true, passive: true });
      window.addEventListener('touchstart', triggerTawkLoad, { once: true, passive: true });
    }
  </script>
