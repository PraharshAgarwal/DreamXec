name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  validate-and-build:
    name: Validate Schema & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Server Dependencies & Generate Prisma Client
        run: |
          cd server
          npm ci || npm install
          npx prisma generate

      - name: Validate Prisma Database Schema
        run: npm run migrate:validate

      - name: Install Client Dependencies & Build Frontend
        run: |
          cd client
          npm ci || npm install
          npm run build

  test-and-coverage:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd server && (npm ci || npm install) && npx prisma generate

      - name: Run Test Suite with Coverage
        run: npm run test:coverage

  lint-and-ratchet:
    name: Incremental Lint Ratchet Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Enforce Lint Ratchet Baseline
        run: npm run lint:ratchet

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Server Dependencies
        run: cd server && npm audit --audit-level=high || true

      - name: Audit Client Dependencies
        run: cd client && npm audit --audit-level=high || true
